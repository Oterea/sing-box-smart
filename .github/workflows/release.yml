name: Build and publish latest packages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          node --test tests/*.cjs
      - name: Set package version
        run: |
          n=${{ github.run_number }}
          n=$((n - 1))
          major=$((n / 121 + 1))
          remainder=$((n % 121))
          minor=$((remainder / 11))
          patch=$((remainder % 11))
          if [ "$major" -gt 10 ]; then
            echo 'package version space exhausted' >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=${major}.${minor}.${patch}" >> "$GITHUB_ENV"
      - name: Set OpenWrt package version
        run: |
          sed -i "s/^PKG_VERSION?.*/PKG_VERSION:=${PACKAGE_VERSION}/" package/sing-box-smart/Makefile
          sed -i "s/^PKG_VERSION?.*/PKG_VERSION:=${PACKAGE_VERSION}/" package/luci-app-sing-box-smart/Makefile
      - name: Build OpenWrt APK packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: aarch64_generic-openwrt-25.12
          PACKAGES: sing-box-smart luci-app-sing-box-smart
          PKG_VERSION: ${{ env.PACKAGE_VERSION }}
          V: s
      - name: Build packages
        run: |
          mkdir -p dist
          find bin/packages -type f -name 'sing-box-smart-*.apk' -exec cp {} dist/sing-box-smart-latest.apk \;
          find bin/packages -type f -name 'luci-app-sing-box-smart-*.apk' -exec cp {} dist/luci-app-sing-box-smart-latest.apk \;
          test -s dist/sing-box-smart-latest.apk
          test -s dist/luci-app-sing-box-smart-latest.apk
          CORE_SHA=$(sha256sum dist/sing-box-smart-latest.apk | awk '{print $1}')
          LUCI_SHA=$(sha256sum dist/luci-app-sing-box-smart-latest.apk | awk '{print $1}')
          python3 - <<PY
          import json
          version = '${PACKAGE_VERSION}'
          base = 'https://github.com/${{ github.repository }}/releases/download/latest/'
          manifest = {
              'version': version,
              'commit': '${{ github.sha }}',
              'core_url': base + 'sing-box-smart-latest.apk',
              'luci_url': base + 'luci-app-sing-box-smart-latest.apk',
              'core_sha256': '${CORE_SHA}',
              'luci_sha256': '${LUCI_SHA}',
          }
          open('dist/sing-box-smart-release.json', 'w').write(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --target "${GITHUB_SHA}" --title "Latest" --notes "自动构建的最新 sing-box-smart 包" --prerelease
          gh release edit latest --target "${GITHUB_SHA}" --title "Latest" --notes "自动构建的最新 sing-box-smart 包"
          for asset in $(gh release view latest --json assets --jq '.assets[].name | select(endswith(".ipk"))'); do
            gh release delete-asset latest "$asset" --yes
          done
          gh release upload latest dist/sing-box-smart-latest.apk dist/luci-app-sing-box-smart-latest.apk dist/sing-box-smart-release.json --clobber
