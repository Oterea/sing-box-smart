name: publish-feed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-feed
  cancel-in-progress: true

env:
  OPENWRT_SDK_URLS: >-
    https://downloads.openwrt.org/releases/25.12.2/targets/armsr/armv8/openwrt-sdk-25.12.2-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
    https://mirror.sjtu.edu.cn/openwrt/releases/25.12.2/targets/armsr/armv8/openwrt-sdk-25.12.2-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set package version
        run: |
          # Run 8 published 0.2.0-r1. Each later run advances one decimal digit.
          version_index=$((20 + GITHUB_RUN_NUMBER - 8))
          version="$((version_index / 100)).$(((version_index / 10) % 10)).$((version_index % 10))"
          sed -i "s/^PKG_VERSION?=.*/PKG_VERSION?=$version/" \
            package/sing-box-smart/Makefile package/luci-app-sing-box-smart/Makefile
          echo "Publishing sing-box-smart and LuCI $version-r1"
          grep '^PKG_VERSION?=' package/sing-box-smart/Makefile package/luci-app-sing-box-smart/Makefile
      - uses: openwrt/gh-action-sdk@main
        env:
          ARCH: aarch64_generic-openwrt-25.12
          PACKAGES: sing-box-smart luci-app-sing-box-smart
          V: s
      - name: Restore OpenWrt SDK cache
        id: sdk-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/openwrt-sdk
          key: openwrt-sdk-25.12.2-armsr-armv8-apktools-${{ runner.os }}
      - name: Download and extract OpenWrt APK tooling
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          sdk_archive="$RUNNER_TEMP/openwrt-sdk.tar.zst"
          downloaded=0
          for sdk_url in $OPENWRT_SDK_URLS; do
            echo "Trying OpenWrt SDK: $sdk_url"
            if curl --fail --location --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 5 \
              --connect-timeout 20 --max-time 300 "$sdk_url" \
              -o "$sdk_archive"; then
              downloaded=1
              break
            fi
            rm -f "$sdk_archive"
          done
          test "$downloaded" = 1
          tar --zstd -x -f "$sdk_archive" \
            --strip-components=1 -C "$RUNNER_TEMP/openwrt-sdk"
          rm -f "$sdk_archive"
          test -x "$RUNNER_TEMP/openwrt-sdk/staging_dir/host/bin/apk"
      - name: Prepare signed feed
        env:
          APK_SIGN_PRIVATE_KEY: ${{ secrets.APK_SIGN_PRIVATE_KEY }}
        run: |
          test -n "$APK_SIGN_PRIVATE_KEY"
          apk_tool="$RUNNER_TEMP/openwrt-sdk/staging_dir/host/bin/apk"
          key="$RUNNER_TEMP/sing-box-smart-private.pem"
          printf '%s' "$APK_SIGN_PRIVATE_KEY" > "$key"
          mkdir -p public/openwrt-25.12/aarch64_generic
          find bin/packages -type f -name 'sing-box-smart-*.apk' -exec cp {} public/openwrt-25.12/aarch64_generic/ \;
          find bin/packages -type f -name 'luci-app-sing-box-smart-*.apk' -exec cp {} public/openwrt-25.12/aarch64_generic/ \;
          cp feed.sh install.sh uninstall.sh public/
          for package in public/openwrt-25.12/aarch64_generic/*.apk; do
            "$apk_tool" --allow-untrusted adbsign --sign-key "$key" --reset-signatures "$package"
          done
          "$apk_tool" mkndx --allow-untrusted --sign-key "$key" \
            --output public/openwrt-25.12/aarch64_generic/packages.adb \
            public/openwrt-25.12/aarch64_generic/*.apk
      - name: Publish feed to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          cp public-key.pem public/public-key.pem
          npx --yes wrangler@4 pages deploy public --project-name sing-box-smart
