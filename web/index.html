<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>sing-box smart · 节点监测</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head>
<body><div class="shell">
<header><a class="brand" href="/"><span>sing-box <strong>smart</strong><small>节点监测与自动选择</small></span></a><div class="header-right"><span class="live-dot"></span><span id="connection">正在连接</span><span id="mode-note" class="mode-inline"><span id="mode-note-text">正在读取运行模式…</span></span></div></header>
<main>
<section class="top-card card"><div class="top-airports"><div class="card-label">策略组</div><div id="airport-options" class="airport-options"><span class="loading">正在加载机场</span></div></div><div class="top-health"><div class="health-progress-row"><progress id="health-progress" max="100" value="0" aria-label="节点检查成功比例"></progress><button id="recheck" class="button secondary">↻&nbsp; 立即检查</button></div><div class="health-caption"><span id="success-summary">尚无检查结果</span><span id="sample-count">0 次检查</span></div></div></section>
<section class="selected-card"><div class="panel-heading"><h2>当前选中节点</h2><span id="phase" class="badge">启动中</span></div><div class="table-scroll"><table class="node-table"><tbody id="selected-node"></tbody></table></div></section>
<section class="nodes-panel"><div class="panel-heading"><div><h2>节点表现 <span id="node-count" class="count">0</span></h2></div><div class="legend"><span><i class="good"></i>延迟 ≤200ms</span><span><i class="medium"></i>200–400ms</span><span><i class="bad"></i>>400ms</span><span class="switch-rule">1.4 倍时切换</span></div></div><div id="status-line" class="status-line">正在启动检查…</div><div class="table-scroll"><table class="node-table"><tbody id="nodes"><tr><td colspan="6" class="empty">正在等待后端数据…</td></tr></tbody></table></div><div class="table-footer"><span>各图独立线性比例，数值越大柱子越高 · 红色虚线柱表示失败 · 分数越低越好</span><span>当前 2s · 优秀候选 30s · 普通节点 5min · 恢复复查逐步放慢</span></div></section>
<section class="events-panel"><div class="panel-heading"><div><h2>运行记录</h2><p>启动、恢复检查与每一次选择，都有迹可循。</p></div><span class="subtle">最近 8 条 · 完整检查记录写入日志</span></div><div id="events" class="events-list"></div></section>
</main><footer><span><span class="footer-dot"></span> sing-box-smart</span><span>可靠性优先，兼顾延迟。 <span id="updated">—</span></span></footer>
</div><div id="toast" role="status" aria-live="polite" hidden></div></body></html>
